[project]
name = "fullhouse"
version = "0.1.0"
description = "AI revenue-operations agents for independent motels and hostels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "sqlmodel>=0.0.22",
    "playwright>=1.48",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "weasyprint>=62",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.scripts]
fullhouse = "fullhouse.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fullhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
